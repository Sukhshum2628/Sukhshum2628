name: Generate Contribution Snake Animation

on:
  schedule:
    # Run once every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-snake.yml"

permissions:
  contents: write

concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Sukhshum2628
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#55e6a5&color_dots=#11171a,#285f4b,#3a8767,#55e6a5,#8cffc3
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#55e6a5

      - name: Push Snake Assets to Repository
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

